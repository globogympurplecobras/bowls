<title>Gallery Console — Indoor Bowls, Glasgow 2026</title>

     No build step, no npm install — open this file (served, or via
     `firebase serve`) and it just runs. -->

     device needs today. -->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  html, body { margin: 0; padding: 0; }
  .bowls-console {
    --bg: #0A0D11; --panel: #12171E; --panel-raised: #182028; --line: #232C36;
    --carpet: #123B52; --carpet-light: #1B5170;
    --live: #E4483C; --standby: #E8A33D; --final: #5B6672;
    --text: #EAEFF3; --text-dim: #8B96A3; --text-faint: #57626F;
    font-family: 'Manrope', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .bowls-console * { box-sizing: border-box; }
  .bowls-console button { font-family: inherit; cursor: pointer; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--line); gap: 16px; flex-wrap: wrap; }
  .topbar-titles .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: var(--carpet-light); }
  .topbar-titles h1 { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.02em; margin: 2px 0 0; text-transform: uppercase; }

  .day-tabs { display: flex; gap: 4px; overflow-x: auto; padding: 2px; }
  .day-tab { font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 0.05em; background: transparent; border: 1px solid var(--line); color: var(--text-dim); padding: 6px 10px; border-radius: 4px; white-space: nowrap; }
  .day-tab-active { background: var(--carpet); border-color: var(--carpet-light); color: var(--text); }

  .sync-pill { display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-faint); border: 1px solid var(--line); border-radius: 20px; padding: 5px 12px; }
  .sync-pill .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); }
  .sync-pill.on .pulse { background: var(--standby); animation: blink 1.4s infinite; }

  .body { display: flex; flex: 1; min-height: 0; }
  .sidenav { width: 168px; border-right: 1px solid var(--line); padding: 16px 8px; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .nav-item { display: flex; align-items: center; gap: 10px; background: transparent; border: none; color: var(--text-dim); padding: 10px 12px; border-radius: 6px; font-size: 13px; text-align: left; }
  .nav-item:hover { background: var(--panel-raised); color: var(--text); }
  .nav-item-active { background: var(--panel-raised); color: var(--text); box-shadow: inset 2px 0 0 var(--carpet-light); }

  .main { flex: 1; padding: 24px; overflow-y: auto; }

  .section-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: var(--text-faint); margin: 4px 0 10px; }
  .wall-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .venue-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  @media (max-width: 720px) { .wall-grid, .venue-strip { grid-template-columns: 1fr; } .sidenav { width: 56px; } .nav-item span { display: none; } }

  .tile { background: linear-gradient(160deg, var(--carpet) 0%, #0E1620 78%); border: 1px solid var(--line); border-radius: 8px; padding: 14px; text-align: left; color: var(--text); display: flex; flex-direction: column; gap: 10px; transition: transform 0.12s ease, border-color 0.12s ease; }
  .tile:hover { transform: translateY(-2px); border-color: var(--carpet-light); }
  .tile-live { border-color: rgba(228,72,60,0.4); }
  .tile-final { opacity: 0.72; }
  .tile-top { display: flex; justify-content: space-between; align-items: center; }
  .tile-rink { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: var(--text-faint); display: flex; align-items: center; gap: 6px; }
  .tv-chip { background: rgba(27,81,112,0.35); color: var(--carpet-light); padding: 2px 6px; border-radius: 3px; letter-spacing: 0.08em; }
  .tile-discipline { font-size: 11px; color: var(--text-dim); }

  .tile-compact { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; text-align: left; color: var(--text); font-size: 12px; }
  .tile-compact-rink { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-faint); }
  .tile-compact-teams { display: flex; align-items: center; gap: 6px; flex: 1; color: var(--text-dim); }

  .tag { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; padding: 3px 7px; border-radius: 3px; display: inline-flex; align-items: center; gap: 5px; }
  .tag-live { background: rgba(228,72,60,0.15); color: var(--live); }
  .tag-standby { background: rgba(232,163,61,0.15); color: var(--standby); }
  .tag-final { background: rgba(91,102,114,0.2); color: var(--final); }
  .dot-live { width: 6px; height: 6px; border-radius: 50%; background: var(--live); animation: blink 1.4s infinite; }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0.25 } }

  .team-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 4px; }
  .flag { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; color: #fff; padding: 2px 5px; border-radius: 3px; letter-spacing: 0.03em; }
  .team-name { color: var(--text); }

  .scoreline { font-family: 'Oswald', sans-serif; font-size: 20px; display: flex; gap: 10px; }
  .scoreline-upcoming { color: var(--text-faint); font-size: 14px; }
  .set { color: var(--text-dim); }
  .set-current { color: var(--text); }

  .pips { display: flex; gap: 3px; }
  .pip { width: 12px; height: 3px; border-radius: 2px; background: var(--line); }
  .pip-done { background: var(--carpet-light); }

  .view-header { margin-bottom: 18px; }
  .sched-header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 10px; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: var(--carpet-light); }
  .view h2 { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.02em; margin: 2px 0 0; }

  .legend-toggle { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); color: var(--text-dim); font-size: 12px; padding: 6px 10px; border-radius: 6px; }
  .legend-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; font-size: 12px; }
  @media (max-width: 720px) { .legend-panel { grid-template-columns: 1fr; } }
  .legend-title { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 12px; letter-spacing: 0.04em; color: var(--text); margin-bottom: 6px; }
  .legend-row { color: var(--text-dim); margin-bottom: 3px; }
  .legend-row b { color: var(--text); font-family: 'IBM Plex Mono', monospace; margin-right: 6px; }
  .legend-muted { color: var(--text-faint); font-size: 11px; margin-top: 4px; }

  .day-note { background: rgba(232,163,61,0.1); border: 1px solid rgba(232,163,61,0.25); color: var(--standby); font-size: 12px; padding: 8px 12px; border-radius: 6px; margin-bottom: 16px; }

  .session-block { margin-bottom: 24px; }
  .session-title { font-family: 'Oswald', sans-serif; font-size: 15px; text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 8px; }
  .session-time { color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 8px; }
  .session-rowhead { display: grid; grid-template-columns: 56px 1fr 1fr 1fr 1fr; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.08em; color: var(--text-faint); padding: 0 4px 6px; border-bottom: 1px solid var(--line); }
  .session-rowhead em { color: var(--carpet-light); font-style: normal; }
  .session-row { display: grid; grid-template-columns: 56px 1fr 1fr 1fr 1fr; gap: 8px; padding: 8px 4px; border-bottom: 1px solid var(--line); align-items: center; }
  .session-row-time { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); }
  @media (max-width: 900px) { .session-rowhead { display: none; } .session-row { grid-template-columns: 1fr 1fr; row-gap: 6px; } .session-row-time { grid-column: 1 / -1; } }

  .mcell { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 11px; color: var(--text-dim); }
  .mcell-tv { color: var(--text); }
  .mcell-empty { color: var(--text-faint); }
  .mcell-commentator { font-family: 'IBM Plex Mono', monospace; font-size: 9px; background: rgba(27,81,112,0.3); color: var(--carpet-light); padding: 1px 5px; border-radius: 3px; }

  .pill-group { display: inline-flex; gap: 3px; }
  .commentator-pill { font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 500; background: rgba(27,81,112,0.3); color: var(--carpet-light); padding: 1px 6px; border-radius: 10px; }
  .commentator-pill-clash { background: rgba(228,72,60,0.22); color: var(--live); box-shadow: 0 0 0 1px rgba(228,72,60,0.5) inset; }
  .clash-summary { display: inline-flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: var(--live); background: rgba(228,72,60,0.12); border: 1px solid rgba(228,72,60,0.35); padding: 4px 10px; border-radius: 20px; margin-bottom: 12px; }
  .mcell-disc { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--text-faint); }
  .mcell-teams { display: inline-flex; align-items: center; gap: 4px; }
  .mcell-label { font-style: italic; color: var(--standby); }

  .back-btn { display: inline-flex; align-items: center; gap: 4px; background: none; border: none; color: var(--text-dim); font-size: 13px; margin-bottom: 16px; padding: 0; }
  .back-btn:hover { color: var(--text); }

  .broadcast-frame { position: relative; background: #05070A; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; max-width: 640px; border: 1px solid var(--line); }
  .broadcast-feed { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; background: repeating-linear-gradient(135deg, #0B0F14, #0B0F14 10px, #0D1218 10px, #0D1218 20px); }
  .overlay-bug { position: absolute; left: 16px; bottom: 16px; background: rgba(8,12,16,0.86); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 10px 14px; min-width: 220px; backdrop-filter: blur(2px); }
  .overlay-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .overlay-name { flex: 1; font-size: 13px; }
  .overlay-score { font-family: 'Oswald', sans-serif; font-size: 20px; }
  .overlay-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.08em; color: var(--text-faint); }

  .venue-only-note { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 12px; color: var(--text-dim); max-width: 640px; }

  .detail-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; max-width: 800px; }
  @media (max-width: 720px) { .detail-panels { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .panel-title { font-family: 'Oswald', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 12px; }
  .panel-note { display: flex; align-items: flex-start; gap: 6px; font-size: 11px; color: var(--text-faint); margin-top: 10px; line-height: 1.5; }

  .score-editor-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .score-editor-row .team-name { flex: 1; font-size: 13px; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button { background: var(--panel-raised); border: 1px solid var(--line); color: var(--text); border-radius: 4px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 1; }
  .stepper-val { font-family: 'Oswald', sans-serif; font-size: 18px; width: 24px; text-align: center; }

  .notes { width: 100%; background: var(--panel-raised); border: 1px solid var(--line); border-radius: 6px; color: var(--text); font-family: 'Manrope', sans-serif; font-size: 13px; padding: 10px; resize: vertical; }
  .notes::placeholder { color: var(--text-faint); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: var(--text-faint); padding: 8px 10px; border-bottom: 1px solid var(--line); }
  tbody td { padding: 9px 10px; border-bottom: 1px solid var(--line); color: var(--text-dim); }
  .td-nation { display: flex; align-items: center; gap: 8px; color: var(--text); }
  .td-pts { font-family: 'Oswald', sans-serif; color: var(--text); font-size: 15px; }
  .row-lead td { background: rgba(27,81,112,0.12); }

  .rundown-block { margin-bottom: 22px; }
  .rundown-block-title { font-family: 'Oswald', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 0.02em; }
  .rundown-block-sub { font-size: 11px; color: var(--text-faint); margin-bottom: 8px; }
  .rundown-row { display: grid; grid-template-columns: 56px 48px 1fr 90px; gap: 10px; padding: 6px 4px; border-bottom: 1px solid var(--line); align-items: center; font-size: 12px; }
  .rundown-t { font-family: 'IBM Plex Mono', monospace; color: var(--carpet-light); }
  .rundown-dur { font-family: 'IBM Plex Mono', monospace; color: var(--text-faint); font-size: 11px; }
  .rundown-content { color: var(--text-dim); }
  .rundown-gfx { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--text-faint); background: var(--panel-raised); padding: 2px 6px; border-radius: 3px; text-align: center; cursor: help; }
  @media (max-width: 640px) { .rundown-row { grid-template-columns: 1fr 1fr; row-gap: 2px; } .rundown-content { grid-column: 1 / -1; } }

  .sync-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 720px) { .sync-grid { grid-template-columns: 1fr; } }
  .sync-card svg { color: var(--carpet-light); margin-bottom: 8px; }
  .ghost-btn { margin-top: 12px; background: transparent; border: 1px dashed var(--line); color: var(--text-faint); font-size: 12px; padding: 8px 12px; border-radius: 6px; width: 100%; }
  code.inline { background: var(--panel-raised); padding: 1px 5px; border-radius: 3px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
</style>

// only thing localStorage is used for; everything else is static.
function loadLocalMatches() {
  try {
    const raw = localStorage.getItem('bowls-matches');
    return raw ? JSON.parse(raw) : DEFAULT_MATCHES;
  } catch (e) { return DEFAULT_MATCHES; }
}

const NAV = [
  { id:'wall', label:'Gallery Wall' },
  { id:'schedule', label:'Schedule' },
  { id:'clashes', label:'Clashes' },
  { id:'rundown', label:'Rundown' },
  { id:'standings', label:'Standings' },
  { id:'sync', label:'Sync' },
];

// ---- Commentator rink-switch clash detection ---------------------------
// A "clash" is one commentator (not necessarily their whole pair) assigned
// to Rink 1 in one time slot and Rink 4 in the very next, or the reverse.
// Returns a Set of keys "dayIdx|sessionIdx|rowIdx|slot|person" for every
// slot-appearance that is one end of such a switch.
function computeClashKeys(schedule) {
  const keys = new Set();
  const people = (code) => (code ? code.split('&') : []);
  schedule.forEach((day, dIdx) => {
    day.sessions.forEach((session, sIdx) => {
      const rows = session.rows;
      for (let i = 0; i < rows.length - 1; i++) {
        const r1 = rows[i], r2 = rows[i + 1];
        const checks = [
          [people(r1.tv1), people(r2.tv4), 'tv1', 'tv4'],
          [people(r1.tv4), people(r2.tv1), 'tv4', 'tv1'],
        ];
        checks.forEach(([p1, p2, slot1, slot2]) => {
          p1.forEach((person) => {
            if (p2.includes(person)) {
              keys.add(`${dIdx}|${sIdx}|${i}|${slot1}|${person}`);
              keys.add(`${dIdx}|${sIdx}|${i + 1}|${slot2}|${person}`);
            }
          });
        });
      }
    });
  });
  return keys;
}
const CLASH_KEYS = computeClashKeys(SCHEDULE);

function Flag({ code }) {
  const n = NATIONS[code] || { name: code, c: '#555' };
  return <span className="flag" style={{ background: n.c }}>{code}</span>;
}

function StatusTag({ status, startsIn }) {
  if (status === 'live') return <span className="tag tag-live"><span className="dot-live" />LIVE</span>;
  if (status === 'upcoming') return <span className="tag tag-standby">{startsIn ? `IN ${startsIn}` : 'STANDBY'}</span>;
  return <span className="tag tag-final">FT</span>;
}

function ScoreLine({ match }) {
  if (match.status === 'upcoming') return <div className="scoreline scoreline-upcoming">— vs —</div>;
  return (
    <div className="scoreline">
      {match.sets.map((s, i) => (
        <span key={i} className={'set ' + (i === match.currentSet && match.status === 'live' ? 'set-current' : '')}>
          {s.a}{'–'}{s.b}
        </span>
      ))}
    </div>
  );
}

function EndPips({ played, total }) {
  return (
    <div className="pips">
      {Array.from({ length: total }).map((_, i) => (
        <span key={i} className={'pip ' + (i < played ? 'pip-done' : '')} />
      ))}
    </div>
  );
}

function RinkTile({ match, onOpen, compact }) {
  if (compact) {
    return (
      <button className="tile-compact" onClick={() => onOpen(match.id)}>
        <span className="tile-compact-rink">RINK {match.rink}</span>
        <span className="tile-compact-teams"><Flag code={match.a} />{match.a} v {match.b}<Flag code={match.b} /></span>
        <StatusTag status={match.status} startsIn={match.startsIn} />
      </button>
    );
  }
  return (
    <button className={'tile tile-' + match.status} onClick={() => onOpen(match.id)}>
      <div className="tile-top">
        <span className="tile-rink">RINK {match.rink} <span className="tv-chip">WORLD FEED</span></span>
        <StatusTag status={match.status} startsIn={match.startsIn} />
      </div>
      <div className="tile-discipline">{match.discipline} · {match.section}</div>
      <div className="tile-teams">
        <div className="team-row"><Flag code={match.a} /><span className="team-name">{NATIONS[match.a]?.name}</span></div>
        <div className="team-row"><Flag code={match.b} /><span className="team-name">{NATIONS[match.b]?.name}</span></div>
      </div>
      <ScoreLine match={match} />
      {match.status !== 'upcoming' && <EndPips played={match.endsPlayed} total={match.endsInSet} />}
    </button>
  );
}

function MatchDetail({ match, onBack, onAdjust }) {
  if (!match) return null;
  const set = match.sets[match.currentSet] || { a: 0, b: 0 };
  return (
    <div className="detail">
      <button className="back-btn" onClick={onBack}>← Gallery Wall</button>

      {match.isTV ? (
        <div className="broadcast-frame">
          <div className="broadcast-feed">CAMERA {match.rink} · RINK {match.rink} FEED</div>
          <div className="overlay-bug">
            <div className="overlay-row"><Flag code={match.a} /><span className="overlay-name">{NATIONS[match.a]?.name}</span><span className="overlay-score">{set.a}</span></div>
            <div className="overlay-row"><Flag code={match.b} /><span className="overlay-name">{NATIONS[match.b]?.name}</span><span className="overlay-score">{set.b}</span></div>
            <div className="overlay-foot"><span>{match.discipline.toUpperCase()}</span><StatusTag status={match.status} startsIn={match.startsIn} /></div>
          </div>
        </div>
      ) : (
        <div className="venue-only-note">Rink {match.rink} isn't on the world feed — in-venue only, no broadcast graphics for this match.</div>
      )}

      <div className="detail-panels">
        <div className="panel">
          <div className="panel-title">Set score — Set {match.currentSet + 1}</div>
          <div className="score-editor">
            <div className="score-editor-row">
              <Flag code={match.a} /><span className="team-name">{NATIONS[match.a]?.name}</span>
              <div className="stepper">
                <button onClick={() => onAdjust(match.id, 'a', -1)}>−</button>
                <span className="stepper-val">{set.a}</span>
                <button onClick={() => onAdjust(match.id, 'a', 1)}>+</button>
              </div>
            </div>
            <div className="score-editor-row">
              <Flag code={match.b} /><span className="team-name">{NATIONS[match.b]?.name}</span>
              <div className="stepper">
                <button onClick={() => onAdjust(match.id, 'b', -1)}>−</button>
                <span className="stepper-val">{set.b}</span>
                <button onClick={() => onAdjust(match.id, 'b', 1)}>+</button>
              </div>
            </div>
          </div>
          <div className="panel-note">{FIREBASE_ENABLED ? 'Synced to Firebase.' : 'Saved to this device only (localStorage) — turn on Firebase in the config block to sync across devices.'}</div>
        </div>

        <div className="panel">
          <div className="panel-title">Producer notes</div>
          <textarea className="notes" placeholder="Ends of note, momentum shifts, graphics callouts..." rows={5} />
          <div className="panel-note">Notes aren't saved yet — wire this up alongside the score sync whenever it's useful.</div>
        </div>
      </div>
    </div>
  );
}

function Standings() {
  return (
    <div className="view">
      <div className="view-header">
        <div className="eyebrow">WOMEN'S SINGLES · SECTION A · ILLUSTRATIVE</div>
        <h2>Standings</h2>
      </div>
      <div className="table-wrap">
        <table>
          <thead><tr><th>Nation</th><th>P</th><th>W</th><th>L</th><th>For</th><th>Ag</th><th>Pts</th></tr></thead>
          <tbody>
            {standings.map((r, i) => (
              <tr key={r.code} className={i === 0 ? 'row-lead' : ''}>
                <td className="td-nation"><Flag code={r.code} />{NATIONS[r.code]?.name}</td>
                <td>{r.p}</td><td>{r.w}</td><td>{r.l}</td><td>{r.f}</td><td>{r.ag}</td>
                <td className="td-pts">{r.pts}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="panel-note" style={{ marginTop: 12 }}>No results exist yet — competition starts 23 July. This table fills in once section play is under way.</div>
    </div>
  );
}

function MatchCell({ m, tv, code }) {
  if (m === null) return <div className="mcell mcell-empty">—</div>;
  const [disc, home, away] = m;
  return (
    <div className={'mcell ' + (tv ? 'mcell-tv' : '')}>
      {tv && code && <span className="mcell-commentator">{code}</span>}
      <span className="mcell-disc">{disc}</span>
      {home ? (
        <span className="mcell-teams"><Flag code={home} />{home} v {away}<Flag code={away} /></span>
      ) : (
        <span className="mcell-label">{away}</span>
      )}
    </div>
  );
}

function Schedule({ dayId }) {
  const day = SCHEDULE[dayId];
  const [showLegend, setShowLegend] = useState(false);
  return (
    <div className="view">
      <div className="view-header sched-header">
        <div>
          <div className="eyebrow">SEC CENTRE HALL 3 · {day.label} · {day.date}</div>
          <h2>Schedule</h2>
        </div>
        <button className="legend-toggle" onClick={() => setShowLegend(v => !v)}>
          {showLegend ? 'Hide' : 'Show'} legend
        </button>
      </div>

      {day.note && <div className="day-note">{day.note}</div>}

      {showLegend && (
        <div className="legend-panel">
          <div className="legend-col">
            <div className="legend-title">Commentators</div>
            {Object.entries(COMMENTATORS).map(([k, v]) => <div className="legend-row" key={k}><b>{k}</b> {v}</div>)}
            <div className="legend-row legend-muted">Codes combine with & (e.g. P&B = Paul and Barry). A few later sessions use a code ("SIAN") not in the original legend — worth confirming with the production team.</div>
          </div>
          <div className="legend-col">
            <div className="legend-title">Disciplines</div>
            {Object.entries(DISCIPLINES).map(([k, v]) => <div className="legend-row" key={k}><b>{k}</b> {v}</div>)}
          </div>
          <div className="legend-col">
            <div className="legend-title">Rinks</div>
            <div className="legend-row"><b>Rink 1 &amp; 4</b> World feed — commentated, on the international broadcast</div>
            <div className="legend-row"><b>Rink 2 &amp; 3</b> In-venue only, not broadcast</div>
          </div>
        </div>
      )}

      {day.sessions.map((s, si) => (
        <div className="session-block" key={si}>
          <div className="session-title">{s.name} <span className="session-time">{s.time}</span></div>
          <div className="session-rowhead">
            <span>TIME</span><span>RINK 1 <em>WORLD FEED</em></span><span>RINK 2</span><span>RINK 3</span><span>RINK 4 <em>WORLD FEED</em></span>
          </div>
          {s.rows.map((r, ri) => (
            <div className="session-row" key={ri}>
              <span className="session-row-time">{r.time}</span>
              <MatchCell m={r.matches[0]} tv code={r.tv1} />
              <MatchCell m={r.matches[1]} />
              <MatchCell m={r.matches[2]} />
              <MatchCell m={r.matches[3]} tv code={r.tv4} />
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

function CommentatorPills({ code, dayIdx, sessionIdx, rowIdx, slot }) {
  if (!code) return null;
  const people = code.split('&');
  return (
    <span className="pill-group">
      {people.map((p, i) => {
        const isClash = CLASH_KEYS.has(`${dayIdx}|${sessionIdx}|${rowIdx}|${slot}|${p}`);
        return <span key={i} className={'commentator-pill ' + (isClash ? 'commentator-pill-clash' : '')}>{p}</span>;
      })}
    </span>
  );
}

function ClashMatchCell({ m, tv, code, dayIdx, sessionIdx, rowIdx, slot }) {
  if (m === null) return <div className="mcell mcell-empty">—</div>;
  const [disc, home, away] = m;
  return (
    <div className={'mcell ' + (tv ? 'mcell-tv' : '')}>
      {tv && code && <CommentatorPills code={code} dayIdx={dayIdx} sessionIdx={sessionIdx} rowIdx={rowIdx} slot={slot} />}
      <span className="mcell-disc">{disc}</span>
      {home ? (
        <span className="mcell-teams"><Flag code={home} />{home} v {away}<Flag code={away} /></span>
      ) : (
        <span className="mcell-label">{away}</span>
      )}
    </div>
  );
}

function Clashes({ dayId }) {
  const day = SCHEDULE[dayId];
  const dayClashCount = React.useMemo(() => {
    let n = 0;
    CLASH_KEYS.forEach((k) => { if (k.startsWith(`${dayId}|`)) n++; });
    return n / 2; // each clash is recorded at both endpoints
  }, [dayId]);

  return (
    <div className="view">
      <div className="view-header sched-header">
        <div>
          <div className="eyebrow">SEC CENTRE HALL 3 · {day.label} · {day.date}</div>
          <h2>Commentator Clashes</h2>
        </div>
      </div>

      {day.note && <div className="day-note">{day.note}</div>}

      <div className="clash-summary">{dayClashCount} rink-switch{dayClashCount === 1 ? '' : 'es'} this day</div>

      <div className="panel-note" style={{ marginBottom: 16 }}>
        A commentator's initials show in a <b style={{ color: 'var(--live)' }}>red pill</b> when that same
        person is also commentating the very next (or previous) time slot on the other world-feed rink —
        meaning they have to physically move between Rink 1 and Rink 4 between matches. Grey pills mean no
        switch at that boundary. Pairs aren't fixed, so within one code (e.g. "DC&amp;S") only the person who's
        actually switching may be highlighted.
      </div>

      {day.sessions.map((s, si) => (
        <div className="session-block" key={si}>
          <div className="session-title">{s.name} <span className="session-time">{s.time}</span></div>
          <div className="session-rowhead">
            <span>TIME</span><span>RINK 1 <em>WORLD FEED</em></span><span>RINK 2</span><span>RINK 3</span><span>RINK 4 <em>WORLD FEED</em></span>
          </div>
          {s.rows.map((r, ri) => (
            <div className="session-row" key={ri}>
              <span className="session-row-time">{r.time}</span>
              <ClashMatchCell m={r.matches[0]} tv code={r.tv1} dayIdx={dayId} sessionIdx={si} rowIdx={ri} slot="tv1" />
              <MatchCell m={r.matches[1]} />
              <MatchCell m={r.matches[2]} />
              <ClashMatchCell m={r.matches[3]} tv code={r.tv4} dayIdx={dayId} sessionIdx={si} rowIdx={ri} slot="tv4" />
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

function Rundown() {
  return (
    <div className="view">
      <div className="view-header">
        <div className="eyebrow">FROM THE MRO WORKBOOK · ONE CANONICAL VERSION</div>
        <h2>Broadcast Rundown</h2>
      </div>
      <div className="panel-note" style={{ marginBottom: 16 }}>Every session sheet in the workbook repeats this same sequence with only the clock times shifting — this is that sequence once, in time-relative-to-match form.</div>
      {RUNDOWN.map(block => (
        <div className="rundown-block" key={block.key}>
          <div className="rundown-block-title">{block.label}</div>
          <div className="rundown-block-sub">{block.sub}</div>
          {block.rows.map((row, i) => {
            const [t, dur, content, gfx] = row;
            return (
              <div className="rundown-row" key={i}>
                <span className="rundown-t">{t}</span>
                <span className="rundown-dur">{dur !== '-' ? dur : ''}</span>
                <span className="rundown-content">{content}</span>
                {gfx !== '-' ? <span className="rundown-gfx" title={GFX_CODES[gfx] || ''}>{gfx}</span> : <span />}
              </div>
            );
          })}
        </div>
      ))}
      <div className="panel-note">Graphic codes: {Object.entries(GFX_CODES).map(([k, v]) => `${k} = ${v}`).join(' · ')}</div>
    </div>
  );
}

function Sync() {
  return (
    <div className="view">
      <div className="view-header">
        <div className="eyebrow">DATA SOURCE</div>
        <h2>Sync</h2>
      </div>
      <div className="sync-grid">
        <div className="panel sync-card">
          <div className="panel-title">Firebase</div>
          {FIREBASE_ENABLED ? (
            <div className="panel-note">Connected — project <code className="inline">{FIREBASE_CONFIG.projectId}</code>. Score edits sync live and will reach any other device open on this same page.</div>
          ) : (
            <div className="panel-note">Not configured. Right now this is a single-device tool — score edits save to this browser only (localStorage). Paste your Firebase Web config into the <code className="inline">FIREBASE_CONFIG</code> block near the top of this HTML file whenever you want another device to see the same live scores. No other changes needed.</div>
          )}
        </div>
        <div className="panel sync-card">
          <div className="panel-title">Live results pull</div>
          <div className="panel-note">Schedule and commentator rota are loaded straight into this file. Live scores still need a source once matches start — manual entry (this app) looks like the reliable path based on what's publicly available.</div>
        </div>
      </div>
    </div>
  );
}

export default function App() {
  const [view, setView] = useState('wall');
  const [dayId, setDayId] = useState(0);
  const [matches, setMatches] = useState(() => FIREBASE_ENABLED ? DEFAULT_MATCHES : loadLocalMatches());
  const [openId, setOpenId] = useState(null);

  // Firebase mode: listen for remote changes (so a second device's edits
  // show up here too, once you're syncing).
  useEffect(() => {
    if (!FIREBASE_ENABLED) return;
    const unsub = db.collection('matches').onSnapshot((snap) => {
      if (snap.empty) {
        // First run against an empty database — seed it with the defaults.
        DEFAULT_MATCHES.forEach(m => db.collection('matches').doc(m.id).set(m));
        return;
      }
      const remote = snap.docs.map(d => d.data());
      setMatches(remote.sort((a, b) => a.rink - b.rink));
    });
    return () => unsub();
  }, []);

  // Local mode: persist to this browser only.
  useEffect(() => {
    if (FIREBASE_ENABLED) return;
    try { localStorage.setItem('bowls-matches', JSON.stringify(matches)); } catch (e) {}
  }, [matches]);

  const adjust = (id, side, delta) => {
    setMatches(prev => {
      const next = prev.map(m => {
        if (m.id !== id) return m;
        const sets = m.sets.map((s, i) => i === m.currentSet ? { ...s, [side]: Math.max(0, s[side] + delta) } : s);
        return { ...m, sets };
      });
      if (FIREBASE_ENABLED) {
        const updated = next.find(m => m.id === id);
        db.collection('matches').doc(id).set(updated, { merge: true });
      }
      return next;
    });
  };

  const openMatch = (id) => { setOpenId(id); setView('detail'); };
  const activeMatch = matches.find(m => m.id === openId);
  const tvMatches = matches.filter(m => m.isTV);
  const venueMatches = matches.filter(m => !m.isTV);

  return (
    <div className="bowls-console">
      <div className="topbar">
        <div className="topbar-titles">
          <div className="eyebrow">WORLD FEED · INDOOR BOWLS</div>
          <h1>Gallery Console — SEC Centre</h1>
        </div>
        <div className="day-tabs">
          {DAYS.map(d => (
            <button key={d.id} className={'day-tab ' + (d.id === dayId ? 'day-tab-active' : '')} onClick={() => setDayId(d.id)}>
              {d.label}<br />{d.date}
            </button>
          ))}
        </div>
        <div className={'sync-pill ' + (FIREBASE_ENABLED ? 'on' : '')}><span className="pulse" />{FIREBASE_ENABLED ? 'FIREBASE SYNCED' : 'LOCAL DEVICE ONLY'}</div>
      </div>

      <div className="body">
        <div className="sidenav">
          {NAV.map(n => (
            <button key={n.id} className={'nav-item ' + (view === n.id || (n.id === 'wall' && view === 'detail') ? 'nav-item-active' : '')} onClick={() => setView(n.id)}>
              <span>{n.label}</span>
            </button>
          ))}
        </div>

        <div className="main">
          {view === 'wall' && (
            <div className="view">
              <div className="view-header">
                <div className="eyebrow">DAY {dayId} · RINKS 1 &amp; 4 ARE THE WORLD FEED</div>
                <h2>Gallery Wall</h2>
              </div>
              <div className="section-label">ON THE WORLD FEED</div>
              <div className="wall-grid">
                {tvMatches.map(m => <RinkTile key={m.id} match={m} onOpen={openMatch} />)}
              </div>
              <div className="section-label" style={{ marginTop: 18 }}>IN VENUE ONLY (RINKS 2 &amp; 3)</div>
              <div className="venue-strip">
                {venueMatches.map(m => <RinkTile key={m.id} match={m} onOpen={openMatch} compact />)}
              </div>
            </div>
          )}
          {view === 'detail' && <MatchDetail match={activeMatch} onBack={() => setView('wall')} onAdjust={adjust} />}
          {view === 'schedule' && <Schedule dayId={dayId} />}
          {view === 'clashes' && <Clashes dayId={dayId} />}
          {view === 'rundown' && <Rundown />}
          {view === 'standings' && <Standings />}
          {view === 'sync' && <Sync />}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
