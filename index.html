<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Gallery Console — Indoor Bowls, Glasgow 2026</title>

<!-- PWA / "Add to Home Screen" support. Safari on iPad mostly ignores
     manifest.json for standalone mode, hence the apple-specific meta tags
     below doing the real work there; manifest.json covers Android/desktop
     Chrome installs. Once added to the home screen this opens full-screen,
     no address bar — meant for on-site producer use on an iPad. -->
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Gallery Console" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0A0D11" />

<!-- React + ReactDOM (UMD builds, no bundler needed) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- Firebase (compat/namespaced SDK — plain script tags, no bundler).
     Only actually used if FIREBASE_CONFIG below has a real apiKey; until
     then the app runs entirely on local state, which is all a single
     device needs today. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  html, body { margin: 0; padding: 0; }
  .bowls-console {
    --bg: #0A0D11; --panel: #12171E; --panel-raised: #182028; --line: #232C36;
    --carpet: #123B52; --carpet-light: #3AA0D6;
    --live: #FF6B5E; --standby: #F5B84D; --final: #8B96A3;
    --text: #F5F8FA; --text-dim: #C3CCD5; --text-faint: #8E99A5;
    --disc-ws-bg: rgba(212,83,126,0.22); --disc-ws-fg: #F4A9C1;
    --disc-mp-bg: rgba(99,153,34,0.22); --disc-mp-fg: #A9D274;
    --disc-ms-bg: rgba(55,138,221,0.22); --disc-ms-fg: #9AC4F2;
    --disc-wp-bg: rgba(186,117,23,0.22); --disc-wp-fg: #F5C583;
    --disc-para-bg: rgba(127,119,221,0.22); --disc-para-fg: #C4BFF2;
    --tile-shade: #0E1620;
    font-family: 'Manrope', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .bowls-console.theme-light {
    --bg: #FAFAF8; --panel: #FFFFFF; --panel-raised: #F0F2F4; --line: #DBE0E5;
    --carpet: #DCEBF3; --carpet-light: #0F6DA8;
    --live: #C7362A; --standby: #946200; --final: #6B7480;
    --text: #14191E; --text-dim: #48525C; --text-faint: #6C7681;
    --disc-ws-bg: #FBEAF0; --disc-ws-fg: #72243E;
    --disc-mp-bg: #EAF3DE; --disc-mp-fg: #27500A;
    --disc-ms-bg: #E6F1FB; --disc-ms-fg: #0C447C;
    --disc-wp-bg: #FAEEDA; --disc-wp-fg: #633806;
    --disc-para-bg: #EEEDFE; --disc-para-fg: #3C3489;
    --tile-shade: #EEF2F5;
  }
  .bowls-console * { box-sizing: border-box; }
  .bowls-console button { font-family: inherit; cursor: pointer; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--line); gap: 16px; flex-wrap: wrap; }
  .topbar-titles .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: var(--carpet-light); }
  .topbar-titles h1 { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.02em; margin: 2px 0 0; text-transform: uppercase; }

  .day-tabs { display: flex; gap: 4px; overflow-x: auto; padding: 2px; }
  .day-tab { font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 0.05em; background: transparent; border: 1px solid var(--line); color: var(--text-dim); padding: 6px 10px; border-radius: 4px; white-space: nowrap; }
  .day-tab-active { background: var(--carpet); border-color: var(--carpet-light); color: var(--text); }

  .sync-pill { display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-faint); border: 1px solid var(--line); border-radius: 20px; padding: 5px 12px; }
  .sync-pill .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); }
  .sync-pill.on .pulse { background: var(--standby); animation: blink 1.4s infinite; }

  .theme-toggle { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 20px; padding: 3px; background: var(--panel); }
  .theme-toggle button { background: transparent; border: none; color: var(--text-faint); font-size: 14px; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .theme-toggle button.theme-active { background: var(--carpet); color: var(--text); }

  .body { display: flex; flex: 1; min-height: 0; }
  .sidenav { width: 168px; border-right: 1px solid var(--line); padding: 16px 8px; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .nav-item { display: flex; align-items: center; gap: 10px; background: transparent; border: none; color: var(--text-dim); padding: 10px 12px; border-radius: 6px; font-size: 13px; text-align: left; }
  .nav-item:hover { background: var(--panel-raised); color: var(--text); }
  .nav-item-active { background: var(--panel-raised); color: var(--text); box-shadow: inset 2px 0 0 var(--carpet-light); }

  .main { flex: 1; padding: 24px; overflow-y: auto; }

  .section-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: var(--text-faint); margin: 4px 0 10px; }
  .wall-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .venue-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  @media (max-width: 720px) { .wall-grid, .venue-strip { grid-template-columns: 1fr; } .sidenav { width: 56px; } .nav-item span { display: none; } }

  .tile { background: linear-gradient(160deg, var(--carpet) 0%, var(--tile-shade) 78%); border: 1px solid var(--line); border-radius: 8px; padding: 14px; text-align: left; color: var(--text); display: flex; flex-direction: column; gap: 10px; transition: transform 0.12s ease, border-color 0.12s ease; cursor: pointer; font-family: inherit; }
  .tile-commentator-row { display: flex; }
  .tile-upcoming-toggle { width: 100%; background: transparent; border: 1px dashed var(--line); color: var(--text-faint); font-size: 11px; padding: 6px 8px; border-radius: 6px; text-align: center; }
  .tile-upcoming-list { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
  .tile-upcoming-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-dim); padding: 6px 4px; border-top: 1px solid var(--line); text-align: left; background: transparent; }
  .tile-upcoming-time { font-family: 'IBM Plex Mono', monospace; color: var(--text-faint); flex-shrink: 0; }
  .tile-upcoming-teams { flex: 1; }
  .tile-upcoming-commentator { color: var(--text-faint); font-size: 10px; flex-shrink: 0; }
  .tile-compact-wrap { display: flex; flex-direction: column; gap: 4px; }
  .tile:hover { transform: translateY(-2px); border-color: var(--carpet-light); }
  .tile-live { border-color: rgba(228,72,60,0.4); }
  .tile-final { opacity: 0.72; }
  .tile-top { display: flex; justify-content: space-between; align-items: center; }
  .tile-rink { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: var(--text-faint); display: flex; align-items: center; gap: 6px; }
  .tv-chip { background: rgba(27,81,112,0.35); color: var(--carpet-light); padding: 2px 6px; border-radius: 3px; letter-spacing: 0.08em; }
  .tile-discipline { font-size: 11px; color: var(--text-dim); }

  .tile-compact { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; text-align: left; color: var(--text); font-size: 12px; }
  .tile-compact-rink { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-faint); }
  .tile-compact-teams { display: flex; align-items: center; gap: 6px; flex: 1; color: var(--text-dim); }

  .tag { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; padding: 3px 7px; border-radius: 3px; display: inline-flex; align-items: center; gap: 5px; }
  .tag-live { background: rgba(228,72,60,0.15); color: var(--live); }
  .tag-standby { background: rgba(232,163,61,0.15); color: var(--standby); }
  .tag-final { background: rgba(91,102,114,0.2); color: var(--final); }
  .dot-live { width: 6px; height: 6px; border-radius: 50%; background: var(--live); animation: blink 1.4s infinite; }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0.25 } }

  .team-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 4px; }
  .flag { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; color: #fff; padding: 2px 5px; border-radius: 3px; letter-spacing: 0.03em; }
  .team-name-wrap { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .team-name { color: var(--text); }
  .team-athlete { font-size: 11px; color: var(--text-faint); font-weight: 400; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile-compact-athletes { font-size: 10px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -2px; }
  .panel-full { grid-column: 1 / -1; }
  .roster-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 480px) { .roster-cols { grid-template-columns: 1fr; } }
  .roster-side-title { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); margin-bottom: 6px; }
  .roster-row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--text-dim); padding: 3px 0; }
  .roster-role { color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; flex-shrink: 0; }
  .roster-name { text-align: right; }
  .roster-empty { font-size: 12px; color: var(--text-faint); }

  .tile-stepper { display: flex; align-items: center; gap: 4px; }
  .tile-stepper button { background: var(--panel-raised); border: 1px solid var(--line); color: var(--text); border-radius: 4px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: 1; }
  .tile-stepper-val { font-family: 'Oswald', sans-serif; font-size: 13px; width: 16px; text-align: center; }
  .tile-compact-score-edit { display: flex; align-items: center; gap: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); }
  .tile-score-input { width: 32px; background: var(--panel-raised); border: 1px solid var(--line); color: var(--text); border-radius: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 2px 4px; text-align: center; }
  .tile-compact-team { display: inline-flex; align-items: center; gap: 4px; }
  .tile-compact-team-winner { font-weight: 700; color: var(--carpet-light); }

  .tile-status-controls { display: flex; gap: 4px; flex-wrap: wrap; margin: 2px 0; }
  .tile-status-btn { background: var(--panel); border: 1px solid var(--line); color: var(--text-dim); font-size: 10px; padding: 4px 8px; border-radius: 5px; }
  .tile-status-btn-active { background: var(--carpet); border-color: var(--carpet-light); color: var(--text); }
  .tile-set-nav { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .tile-set-nav button { background: var(--panel-raised); border: 1px solid var(--line); color: var(--text); border-radius: 4px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 13px; line-height: 1; }
  .tile-set-nav button:disabled { opacity: 0.35; cursor: default; }
  .tile-set-nav-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: var(--text-faint); }
  .tag-winner { background: rgba(58,160,214,0.15); color: var(--carpet-light); }
  .team-row-winner .team-name { font-weight: 700; }
  .tile-winner-note { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: var(--carpet-light); }

  .scoreline { font-family: 'Oswald', sans-serif; font-size: 20px; display: flex; gap: 10px; }
  .scoreline-compact { font-size: 12px; gap: 6px; }
  .scoreline-upcoming { color: var(--text-faint); font-size: 14px; }
  .set { color: var(--text-dim); }
  .set-current { color: var(--text); }

  .pips { display: flex; gap: 3px; }
  .pip { width: 12px; height: 3px; border-radius: 2px; background: var(--line); }
  .pip-done { background: var(--carpet-light); }

  .view-header { margin-bottom: 18px; }
  .sched-header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 10px; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: var(--carpet-light); }
  .view h2 { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.02em; margin: 2px 0 0; }

  .legend-toggle { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); color: var(--text-dim); font-size: 12px; padding: 6px 10px; border-radius: 6px; }
  .discipline-select { background: var(--panel); border: 1px solid var(--line); color: var(--text); font-family: 'Manrope', sans-serif; font-size: 12px; padding: 7px 10px; border-radius: 6px; }
  .legend-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; font-size: 12px; }
  @media (max-width: 720px) { .legend-panel { grid-template-columns: 1fr; } }
  .legend-title { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 12px; letter-spacing: 0.04em; color: var(--text); margin-bottom: 6px; }
  .legend-row { color: var(--text-dim); margin-bottom: 3px; }
  .legend-row b { color: var(--text); font-family: 'IBM Plex Mono', monospace; margin-right: 6px; }
  .legend-muted { color: var(--text-faint); font-size: 11px; margin-top: 4px; }

  .day-note { background: rgba(232,163,61,0.1); border: 1px solid rgba(232,163,61,0.25); color: var(--standby); font-size: 12px; padding: 8px 12px; border-radius: 6px; margin-bottom: 16px; }

  .session-block { margin-bottom: 24px; }
  .session-title { font-family: 'Oswald', sans-serif; font-size: 15px; text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 8px; }
  .session-time { color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 8px; }
  .session-rowhead { display: grid; grid-template-columns: 56px 1fr 1fr 1fr 1fr; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.08em; color: var(--text-faint); padding: 0 4px 6px; border-bottom: 1px solid var(--line); }
  .session-rowhead em { color: var(--carpet-light); font-style: normal; }
  .session-row { display: grid; grid-template-columns: 56px 1fr 1fr 1fr 1fr; gap: 8px; padding: 8px 4px; border-bottom: 1px solid var(--line); align-items: center; }
  .session-row-time { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); }
  @media (max-width: 900px) { .session-rowhead { display: none; } .session-row { grid-template-columns: 1fr 1fr; row-gap: 6px; } .session-row-time { grid-column: 1 / -1; } }

  .mcell { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); padding: 4px 6px; border-radius: 6px; border-left: 3px solid transparent; }
  .mcell-tv { color: var(--text); border-left-color: var(--carpet-light); background: var(--panel); }
  .mcell-empty { color: var(--text-faint); }
  .mcell-commentator { font-family: 'Manrope', sans-serif; font-size: 12px; font-weight: 700; background: var(--carpet); color: var(--text); border: 1px solid var(--carpet-light); padding: 3px 8px; border-radius: 4px; letter-spacing: 0.01em; }
  .mcell-disc { font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 4px; background: var(--panel-raised); color: var(--text-dim); }
  .mcell-disc-WS { background: var(--disc-ws-bg); color: var(--disc-ws-fg); }
  .mcell-disc-MP { background: var(--disc-mp-bg); color: var(--disc-mp-fg); }
  .mcell-disc-MS { background: var(--disc-ms-bg); color: var(--disc-ms-fg); }
  .mcell-disc-WP { background: var(--disc-wp-bg); color: var(--disc-wp-fg); }
  .mcell-disc-PXP, .mcell-disc-PMP, .mcell-disc-PWP { background: var(--disc-para-bg); color: var(--disc-para-fg); }
  .mcell-teams { display: inline-flex; align-items: center; gap: 4px; }
  .mcell-label { font-style: italic; color: var(--standby); font-weight: 600; }

  .back-btn { display: inline-flex; align-items: center; gap: 4px; background: none; border: none; color: var(--text-dim); font-size: 13px; margin-bottom: 16px; padding: 0; }
  .back-btn:hover { color: var(--text); }

  .status-btns { display: flex; gap: 8px; margin-bottom: 16px; }
  .status-btn { background: var(--panel); border: 1px solid var(--line); color: var(--text-dim); font-size: 12px; padding: 7px 12px; border-radius: 6px; }
  .status-btn-active { background: var(--carpet); border-color: var(--carpet-light); color: var(--text); }

  .slot-picker { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .slot-picker select { font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 6px 10px; border-radius: 6px; }

  .broadcast-frame { position: relative; background: #05070A; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; max-width: 640px; border: 1px solid var(--line); }
  .broadcast-feed { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; background: repeating-linear-gradient(135deg, #0B0F14, #0B0F14 10px, #0D1218 10px, #0D1218 20px); }
  .overlay-bug { position: absolute; left: 16px; bottom: 16px; background: rgba(8,12,16,0.86); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 10px 14px; min-width: 220px; backdrop-filter: blur(2px); }
  .overlay-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .overlay-name { flex: 1; font-size: 13px; }
  .overlay-score { font-family: 'Oswald', sans-serif; font-size: 20px; }
  .overlay-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.08em; color: var(--text-faint); }

  .venue-only-note { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 12px; color: var(--text-dim); max-width: 640px; }

  .detail-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; max-width: 800px; }
  @media (max-width: 720px) { .detail-panels { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .panel-title { font-family: 'Oswald', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 12px; }
  .panel-note { display: flex; align-items: flex-start; gap: 6px; font-size: 11px; color: var(--text-faint); margin-top: 10px; line-height: 1.5; }
  .panel-note-warn { color: var(--standby); }

  .score-editor-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .score-editor-row .team-name { flex: 1; font-size: 13px; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button { background: var(--panel-raised); border: 1px solid var(--line); color: var(--text); border-radius: 4px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 1; }
  .stepper-val { font-family: 'Oswald', sans-serif; font-size: 18px; width: 24px; text-align: center; }

  .notes { width: 100%; background: var(--panel-raised); border: 1px solid var(--line); border-radius: 6px; color: var(--text); font-family: 'Manrope', sans-serif; font-size: 13px; padding: 10px; resize: vertical; }
  .notes::placeholder { color: var(--text-faint); }

  .log-entry-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .log-input { background: var(--panel-raised); border: 1px solid var(--line); border-radius: 6px; color: var(--text); font-family: 'Manrope', sans-serif; font-size: 13px; padding: 8px 10px; width: 100%; }
  .log-input::placeholder { color: var(--text-faint); }
  .log-input-desc { resize: vertical; }
  .log-rating-row { display: flex; gap: 4px; }
  .log-rating-btn { background: transparent; border: 1px solid var(--line); color: var(--text-faint); border-radius: 4px; width: 28px; height: 28px; font-size: 14px; }

    role: 'Skip',
    name: entry.skip
  });
  if (entry.skipDirector) rows.push({
    role: 'Skip Director',
    name: entry.skipDirector
  });
  return rows;
